# HorizonStream official release
horizonstream:
  cfg:
    _target_: models.fastmodel.HorizonStreamEval
    checkpoint: checkpoints/horizonstream/HorizonStream.pt
    horizonstream_root: third_party/HorizonStream
    img_size: 518
    patch_size: 14
    crop: true
    window_size: 10
    sliding_size: 21
    abs_pose_source: online
    enable_offline_motion_averaging: false
    # Horizon's public README "Minimal Python inference" uses FP16 autocast.
    amp_dtype: fp16
    strict_load: true
  infer_cameras_c2w:
    _target_: interfaces.horizonstream.infer_cameras_c2w
    _partial_: true
  infer_cameras_w2c:
    _target_: interfaces.horizonstream.infer_cameras_w2c
    _partial_: true
  infer_mv_pointclouds:
    _target_: interfaces.horizonstream.infer_mv_pointclouds
    _partial_: true


abot_recon:
  eval_output_name: null
  cfg:
    _target_: models.abot_recon.ABotReconEval
    ckpt: checkpoints/abot_recon.safetensors
    device: ${device}
    height: 280
    width: 504
    fov_pad_rgb: [0.485, 0.456, 0.406]
    local_window_frames: 12
    local_window_override: 12
    infer_mode: stream
    attention_backend: auto
    amp_dtype: bf16
    max_frames: 22000
    num_frames_cap: 22000
  infer_cameras_c2w:
    _target_: interfaces.abot_recon.infer_cameras_c2w
    _partial_: true
  infer_cameras_w2c:
    _target_: interfaces.abot_recon.infer_cameras_w2c
    _partial_: true
  infer_mv_pointclouds:
    _target_: interfaces.abot_recon.infer_mv_pointclouds
    _partial_: true
