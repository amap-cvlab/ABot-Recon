# @package _global_
# Formal TUM-Dynamics-Full point-cloud protocol: all associated RGB frames.

defaults:
  - override /data: mv_recon

name: mv_recon_tum_full
eval_models: []
eval_datasets: [TUM-Dynamics-Full]

no_crop: true
load_img_size: 518
nearest_depth_to_gt: true
pc_align_with_scale: true
pc_alignment_depth_max_by_model:
  horizonstream: 40.0
pc_eval_threshold: 0.25
pc_eval_thresholds: [0.05, 0.25]

kf_every: 1
rebuild_seq_id_map: false
device: cuda
verbose: false
seed: 42
save_suffix: tum_full_s1
save_ply: true
save_ply_max_seqs: 2
save_ply_max_points: 300000
save_traj_bev: false
require_runtime_manifest: true
